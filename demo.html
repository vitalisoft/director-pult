<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Демо · Пульт директора</title>
<style>
/* ===== Дизайн-система: токены (копия из index.html, описание в docs/design-system.md) ===== */
:root {
  color-scheme: light;
  /* Цвет: один акцент и его оттенки */
  --c-accent: #1d4ed8;
  --c-accent-hover: #1e40af;
  --c-accent-50: #eef4ff;
  --c-accent-100: #dbe7fe;
  --c-accent-200: #bfd3fb;
  --c-accent-300: #93b4f8;
  /* Текст */
  --c-text: #1a2230;
  --c-muted: #4b5563;
  --c-on-accent: #ffffff;
  --c-on-accent-muted: #dbe7fe;
  /* Поверхности и линии */
  --c-bg: #ffffff;
  --c-tint: #f1f5ff;
  --c-tint-end: #f8fbff;
  --c-surface: #ffffff;
  --c-surface-soft: #f3f6fb;
  --c-neutral: #f3f4f6;
  --c-border: #d9e0ec;
  --c-border-strong: #c3ccda;
  /* Статусы: только внутри макетов (.mockup и иллюстрация первого экрана) */
  --st-red: #b91c1c; --st-red-bg: #fee2e2;
  --st-amber: #b45309; --st-amber-bg: #fef3c7; --st-amber-text: #92400e;
  --st-green: #15803d;

  /* Шрифт: системный стек, без файлов шрифтов и загрузки из сети */
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-xs: .8125rem;   /* 13px: метки, плашки */
  --fs-sm: .9375rem;   /* 15px: подписи, подсказки */
  --fs-body: 1rem;     /* 16px: текст в карточках */
  --fs-base: 1.0625rem;/* 17px: основной текст */
  --fs-lead: 1.05rem;  /* лид на телефоне; 1.125rem с 720px */
  --fs-h3: 1.1875rem;  /* 19px */
  --fs-h2: 1.75rem;    /* 28px; 2.25rem с 720px */
  --fs-h1: 1.75rem;    /* 28px; 2.75rem с 720px; 3rem с 960px */
  --fw-regular: 400; --fw-semibold: 600; --fw-bold: 700; --fw-heavy: 800;
  --lh-tight: 1.15; --lh-heading: 1.2; --lh-snug: 1.4; --lh-body: 1.55;
  --ls-tight: -.01em; --ls-caps: .08em;

  /* Отступы: шаг 4/8 px */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
  --sp-6: 32px; --sp-7: 48px; --sp-8: 64px; --sp-9: 96px;
  --section-y: var(--sp-8);      /* 64px; 96px с 720px */
  --container: 1120px;
  --gutter: var(--sp-4);         /* 16px; 24px с 720px */
  --gap: var(--sp-4);            /* 16px; 24px с 720px */

  /* Скругления */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-pill: 999px;

  /* Тени: мягкие, с оттенком акцента */
  --sh-sm: 0 1px 2px rgba(16, 24, 40, .06);
  --sh-md: 0 8px 24px rgba(29, 78, 216, .08);
  --sh-lg: 0 18px 30px rgba(29, 78, 216, .18);

  /* Фокус */
  --focus-width: 3px;
  --focus-offset: 2px;

  /* Переходы при наведении: одно время и кривая для всех */
  --t-hover: 160ms ease;
}
@media (min-width: 720px) {
  :root { --fs-lead: 1.125rem; --fs-h2: 2.25rem; --section-y: var(--sp-9); --gutter: var(--sp-5); --gap: var(--sp-5); }
}

/* ===== База ===== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: var(--lh-body);
  overflow-wrap: break-word;
}
h2, h3 { line-height: var(--lh-heading); margin: 0 0 .5em; }
p { margin: 0 0 1em; }
a { color: var(--c-accent); }
a:focus-visible, button:focus-visible { outline: var(--focus-width) solid var(--c-accent); outline-offset: var(--focus-offset); }
button { font: inherit; color: inherit; margin: 0; }

/* ===== Компоненты ===== */
.pill {
  display: inline-block;
  padding: 2px 10px;
  border: 1px solid transparent;
  border-radius: var(--r-pill);
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  line-height: 1.5;
  white-space: nowrap;
}

/* ===== Страница демо: колонка «подпись + экран» ===== */
.demo-page { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.demo-note { flex: 0 0 auto; margin: 0; padding: var(--sp-2) var(--sp-4); color: var(--c-muted); font-size: var(--fs-sm); line-height: var(--lh-snug); text-align: center; }
.demo-device { flex: 1 1 auto; min-height: 0; display: flex; width: 100%; }
.demo-screen { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: var(--c-surface-soft); font-size: var(--fs-xs); line-height: 1.4; }
.demo-head { flex: 0 0 auto; padding: var(--sp-4) var(--sp-4) var(--sp-3); }
.demo-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--sp-1) var(--sp-4) var(--sp-4); scrollbar-color: var(--c-border-strong) transparent; }
.demo-screen .mock-status, .demo-screen .mock-home { display: none; }

/* ===== Рамка телефона: с 600px экран показан в корпусе смартфона ===== */
@media (min-width: 600px) {
  body { background: var(--c-tint); }
  .demo-page { height: auto; min-height: 100vh; min-height: 100dvh; align-items: center; justify-content: center; gap: var(--sp-4); padding: var(--sp-5) var(--sp-4); }
  .demo-note { padding: 0; }
  .demo-device { flex: 0 0 auto; width: 360px; height: max(560px, min(760px, calc(100vh - 104px))); height: max(560px, min(760px, calc(100dvh - 104px))); padding: 10px; background: var(--c-text); border-radius: 40px; box-shadow: var(--sh-lg); }
  .demo-screen { overflow: hidden; padding: var(--sp-2) 0; border-radius: 32px; }
  .demo-head { padding: 0 var(--sp-4) var(--sp-3); }
  .demo-scroll { padding: var(--sp-1) var(--sp-4) var(--sp-3); }
  .demo-screen .mock-status { display: flex; margin: 0 var(--sp-4) var(--sp-2); }
  .demo-screen .mock-home { display: block; margin: var(--sp-2) auto 0; }
}

/* ===== Макет экрана (как в index.html) ===== */
.mock-status { position: relative; display: flex; align-items: center; justify-content: space-between; min-height: 28px; margin-bottom: var(--sp-2); padding: 0 var(--sp-2); font-size: var(--fs-xs); font-weight: var(--fw-bold); }
.mock-island { position: absolute; left: 50%; top: 4px; width: 72px; height: 20px; margin-left: -36px; border-radius: var(--r-pill); background: var(--c-text); }
.mock-status svg { width: 22px; height: 12px; color: var(--c-text); }
.mock-title { font-weight: var(--fw-bold); font-size: var(--fs-sm); line-height: var(--lh-snug); }
.mock-step { margin-top: 2px; color: var(--c-muted); font-size: var(--fs-xs); }
.mock-step b { color: var(--c-accent); }
.mock-ask { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.mock-input { flex: 1 1 0; min-width: 0; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3); color: var(--c-muted); font-size: var(--fs-xs); overflow-wrap: anywhere; }
.mock-btn { position: relative; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: var(--c-accent); color: var(--c-on-accent); border-radius: 50%; }
.mock-btn svg { width: 20px; height: 20px; }
.mock-btn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.mock-tiles { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-2); margin-bottom: var(--sp-3); }
.mock-tile { display: block; width: 100%; min-width: 0; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3); color: inherit; font: inherit; text-align: left; overflow-wrap: anywhere; }
.mock-tile .pill { margin-top: var(--sp-1); white-space: normal; }
.mock-num { display: block; font-size: 1.5rem; font-weight: var(--fw-bold); line-height: 1.1; }
.mock-lbl { display: block; margin-top: 2px; color: var(--c-muted); font-size: var(--fs-xs); }
.st-red { color: var(--st-red); }
.st-amber { color: var(--st-amber); }
.st-green { color: var(--st-green); }
.mock-list { margin-bottom: var(--sp-4); background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3); }
.mock-list h3 { font-size: var(--fs-sm); margin: 0 0 2px; }
.mock-row { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-2) 0; border-top: 1px solid var(--c-border); }
.mock-row:first-of-type { border-top: 0; }
/* Карточка с несколькими группами строк (срез сотрудника): первая строка под заголовком без линии, между группами отступ */
.mock-list h3 + .mock-row { border-top: 0; }
.mock-list .mock-row + h3 { margin-top: var(--sp-3); }
.mock-row span:first-child { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
.mock-row .pill { flex: 0 0 auto; white-space: nowrap; }
.demo-screen .pill--red { background: var(--st-red-bg); color: var(--st-red); }
.demo-screen .pill--amber { background: var(--st-amber-bg); color: var(--st-amber-text); }
/* «В работе»: статусного фона нет, поэтому белый фон, рамка и зелёный текст (5,02 на #fff) */
.demo-screen .pill--green { background: var(--c-surface); border-color: var(--c-border); color: var(--st-green); }
.pill--muted { background: var(--c-surface-soft); border-color: var(--c-border); color: var(--c-muted); }
.mock-home { flex: 0 0 auto; width: 104px; height: 4px; border-radius: var(--r-pill); background: var(--c-text); }

/* ===== Шапка экрана: кнопки «Назад» и «Главная» ===== */
.demo-nav { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); }
.demo-nav--off { display: none; }
.demo-navbtn { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 44px; padding: 0 var(--sp-4); background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-pill); color: var(--c-accent); font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
.demo-navbtn svg { width: 18px; height: 18px; flex: 0 0 auto; }

/* ===== Экраны демо ===== */
.demo-view[hidden] { display: none; }
.demo-view h2 { margin: 0 0 var(--sp-3); font-size: var(--fs-body); font-weight: var(--fw-bold); line-height: var(--lh-snug); overflow-wrap: anywhere; }
.demo-view h2:focus { outline: none; }
.demo-view h2:focus-visible { outline: var(--focus-width) solid var(--c-accent); outline-offset: var(--focus-offset); border-radius: var(--r-sm); }
.demo-group h3 { font-size: var(--fs-sm); margin: 0 0 var(--sp-2); }
.demo-link { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); width: 100%; min-height: 44px; padding: var(--sp-2) var(--sp-3); background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-md); color: var(--c-text); font-size: var(--fs-sm); font-weight: var(--fw-semibold); text-align: left; }
.demo-link svg { width: 20px; height: 20px; flex: 0 0 auto; color: var(--c-accent); }
.demo-link > span:first-child { flex: 1 1 auto; }
.demo-link + .demo-link { margin-top: var(--sp-2); }
/* Плашка в кнопке раздела на узком экране переносится на две строки, слова не рвутся */
.demo-link__end { flex: 0 1 auto; display: inline-flex; align-items: center; gap: var(--sp-2); }
.demo-link__end .pill { white-space: normal; text-align: center; }
.demo-row { width: 100%; min-height: 44px; align-items: center; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: var(--c-text); font-size: var(--fs-xs); text-align: left; }
.demo-row__sub { display: block; margin-top: 2px; color: var(--c-muted); }
.demo-later { margin: calc(-1 * var(--sp-1)) 0 var(--sp-3); }

/* Карточка записи: поля, история, финал */
.demo-fields { margin: 0 0 var(--sp-3); }
.demo-fields + h3 { margin-top: var(--sp-1); }
.demo-field { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-3); padding: var(--sp-2) 0; border-top: 1px solid var(--c-border); }
.demo-field:first-child { border-top: 0; }
.demo-field dt { color: var(--c-muted); }
.demo-field dt span { display: block; }
.demo-fields--money dd { white-space: nowrap; }
.demo-field dd { margin: 0; font-weight: var(--fw-semibold); text-align: right; }
/* «Ответственный»: кнопка в срез сотрудника, выглядит как ссылка, а не как плашка */
.demo-who { display: inline-flex; align-items: center; justify-content: flex-end; min-height: 44px; padding: 0; background: none; border: 0; color: var(--c-accent); font-size: inherit; font-weight: var(--fw-semibold); text-align: right; text-decoration: underline; text-underline-offset: 2px; }
.demo-history { margin: 0 0 var(--sp-3); padding: 0; list-style: none; }
.demo-history li { position: relative; padding: 0 0 var(--sp-3) var(--sp-5); }
.demo-history li:last-child { padding-bottom: 0; font-weight: var(--fw-semibold); }
.demo-history li::before { content: ""; position: absolute; left: 0; top: .25em; width: 12px; height: 12px; border: 2px solid var(--c-accent); border-radius: 50%; background: var(--c-surface); }
.demo-history li:last-child::before { background: var(--c-accent); }
.demo-history li:not(:last-child)::after { content: ""; position: absolute; left: 5px; top: calc(.25em + 12px); bottom: 0; width: 2px; background: var(--c-border); }
/* Линия «план и факт» в записи показателя */
.demo-chart { margin: 0 0 var(--sp-3); }
.demo-chart h3 { margin: 0 0 var(--sp-1); }
.demo-chart__legend { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); margin-bottom: var(--sp-2); }
.demo-chart__key { display: inline-flex; align-items: center; gap: var(--sp-2); white-space: nowrap; font-weight: var(--fw-semibold); }
.demo-chart__key::before { content: ""; width: 20px; border-top: 3px solid var(--c-accent); }
.demo-chart__key--plan { color: var(--c-muted); }
.demo-chart__key--plan::before { border-top: 2px dashed var(--c-muted); }
.demo-chart__svg { display: block; width: 100%; height: auto; overflow: visible; }
.demo-chart__grid { stroke: var(--c-border); stroke-width: 1; }
.demo-chart__plan { fill: none; stroke: var(--c-muted); stroke-width: 2; stroke-dasharray: 5 4; }
.demo-chart__fact { fill: none; stroke: var(--c-accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.demo-chart__dot { fill: var(--c-surface); stroke: var(--c-accent); stroke-width: 2; }
.demo-chart__dot--last { fill: var(--c-accent); }
.demo-chart__axis { display: flex; justify-content: space-between; gap: var(--sp-2); margin-top: var(--sp-1); color: var(--c-muted); font-size: var(--fs-xs); }
.demo-final { margin: 0; padding-top: var(--sp-3); border-top: 1px solid var(--c-border); font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
.demo-tg { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 44px; color: var(--c-accent); font-size: var(--fs-sm); font-weight: var(--fw-semibold); text-decoration: none; }
.demo-tg svg { width: 20px; height: 20px; flex: 0 0 auto; }

/* ===== Состояния при наведении и фокусе (единые, см. docs/design-system.md) ===== */
a, button { cursor: pointer; }
.demo-view h2, .pill { cursor: default; }
button .pill { cursor: inherit; }
/* Клавиатура видит то же, что мышь */
.demo-navbtn:focus-visible { background: var(--c-accent-50); border-color: var(--c-accent-200); color: var(--c-accent-hover); }
.demo-link:focus-visible, .mock-tile:focus-visible { border-color: var(--c-accent-200); box-shadow: var(--sh-sm); }
.demo-row:focus-visible { background: var(--c-accent-50); box-shadow: calc(-1 * var(--sp-3)) 0 0 var(--c-accent-50), var(--sp-3) 0 0 var(--c-accent-50); }
.demo-tg:focus-visible { color: var(--c-accent-hover); text-decoration: underline; }
.demo-who:focus-visible { color: var(--c-accent-hover); }
@media (prefers-reduced-motion: no-preference) {
  .demo-navbtn, .demo-link, .demo-row, .demo-tg, .demo-who, .mock-tile { transition: background-color var(--t-hover), border-color var(--t-hover), box-shadow var(--t-hover), color var(--t-hover); }
  .demo-view:not([hidden]) { animation: demo-fade 160ms ease; }
  @keyframes demo-fade { from { opacity: 0; } to { opacity: 1; } }
}
@media (hover: hover) and (pointer: fine) {
  .demo-navbtn:hover { background: var(--c-accent-50); border-color: var(--c-accent-200); color: var(--c-accent-hover); }
  .demo-link:hover { border-color: var(--c-accent-200); box-shadow: var(--sh-sm); }
  .mock-tile:hover { border-color: var(--c-accent-200); box-shadow: var(--sh-sm); }
  .demo-row:hover { background: var(--c-accent-50); box-shadow: calc(-1 * var(--sp-3)) 0 0 var(--c-accent-50), var(--sp-3) 0 0 var(--c-accent-50); }
  .demo-tg:hover { color: var(--c-accent-hover); text-decoration: underline; }
  .demo-who:hover { color: var(--c-accent-hover); }
}

/* ===== Печать: только главный экран, чёрный текст на белом ===== */
@media print {
  *, *::before, *::after { transition: none !important; animation: none !important; box-shadow: none !important; }
  body, .demo-device, .demo-screen { background: #fff !important; }
  body *:not(svg):not(svg *) { color: #000 !important; }
  .demo-page { display: block; height: auto; min-height: 0; padding: 0; }
  .demo-device { width: auto; height: auto !important; padding: 0; border-radius: 0; }
  .demo-screen, .demo-scroll { overflow: visible; }
  .mock-status, .mock-home, .mock-step, .demo-nav, .demo-view { display: none !important; }
  .demo-view[data-screen="home"] { display: block !important; }
  .mock-input, .mock-tile, .mock-list, .mock-row, .demo-link, .pill { background: #fff !important; border-color: #000 !important; }
  .pill, .demo-link { border: 1px solid #000 !important; }
  .mock-btn { background: #fff !important; border: 2px solid #000; }
  .mock-btn svg, .demo-link svg { color: #000; }
}
</style>
</head>
<body>
<main class="demo-page">
  <p class="demo-note">Демо на условных данных. Это макет, а не готовый продукт.</p>
  <div class="demo-device">
  <div class="demo-screen">
    <div class="mock-status" aria-hidden="true"><span>9:41</span><span class="mock-island"></span><svg viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1" width="17" height="10" rx="2.5"/><rect x="3" y="3" width="10" height="6" rx="1" fill="currentColor" stroke="none"/><path d="M20 4.5v3" stroke-linecap="round"/></svg></div>
    <div class="demo-head">
      <div class="mock-title">Пульт директора · ООО «Образец»</div>
      <div class="mock-step" id="demo-step">Шаг <span>1</span> из 3 · <b>Главный экран</b></div>
      <div class="demo-nav demo-nav--off" id="demo-nav">
        <button type="button" class="demo-navbtn" data-back><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Назад</button>
        <button type="button" class="demo-navbtn" data-root>Главная</button>
      </div>
    </div>
    <div class="demo-scroll" id="demo-scroll">
      <section class="demo-view" data-screen="home" data-step="1" data-label="Главный экран">
        <h2 tabindex="-1">Срочные задачи</h2>
        <div class="mock-ask">
          <div class="mock-input">Спросить голосом или текстом: «Что просрочено у Петрова?»</div>
          <div class="mock-btn"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Спросить</span></div>
        </div>
        <div class="mock-tiles">

      list.appendChild(row(t.id, t.title, STAFF[t.who].name + ' · ' + t.due, t.st, t.pill));
      var box = card(view(t.id, 3, t.label, t.title));
      box.appendChild(fields([['Ответственный', who(t.who)], ['Срок', t.due], ['Статус', t.status]]));
      tail(box, t.history);
    }
  }

  /* ===== Раздел «Согласования документов» и записи документов ===== */
  function renderDocs() {
    var list = card(view('docs', 2, 'Согласования документов', 'Согласования документов', true));
    for (var i = 0; i < DOCS.length; i++) {
      var d = DOCS[i];
      list.appendChild(row(d.id, d.short, 'Ждёт ' + d.wait + ' · ' + STAFF[d.who].name, d.st, d.days));
      var box = card(view(d.id, 3, d.short, d.title, true));
      box.appendChild(fields([['Сумма', d.sum], ['Чего ждёт', d.wait], ['Ждёт', d.days], ['Ответственный', who(d.who)], ['Статус', d.status]]));
      tail(box, d.history);
    }
  }

  /* ===== Запись «Простои оборудования сегодня» ===== */
  function renderDowntime() {
    var box = card(view('downtime', 3, 'Простои оборудования', 'Простои оборудования сегодня', true));
    for (var i = 0; i < DOWNTIME.items.length; i++) {
      var p = DOWNTIME.items[i];
      box.appendChild(el('h3', null, p.machine));
      box.appendChild(fields([['Простой сегодня', p.today], ['Причина', p.reason], ['Кто чинит', person(p.who)], ['Сейчас', p.now], ['Связь', p.link]]));
    }
    tail(box, DOWNTIME.history);
  }

  /* ===== Раздел «Сотрудники» и срезы по сотрудникам ===== */
  /* Записи сотрудника из списка: red — в просрочку, остальные — в other; порядок как в списке */
  function split(list, key, red, other) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].who === key) (list[i].st === 'red' ? red : other).push(list[i]);
    }
  }
  function taskRow(t) { return row(t.id, t.title, t.due, t.st, t.pill); }
  function docRow(d) { return row(d.id, d.short, 'Ждёт ' + d.wait, d.st, d.days); }

  /* Блок среза: заголовок и строки; пустой блок не выводится */
  function group(box, title, items, make) {
    if (!items.length) return;
    box.appendChild(el('h3', null, title));
    for (var i = 0; i < items.length; i++) box.appendChild(make(items[i]));
  }

  function renderStaff() {
    var list = card(view('staff', 2, 'Сотрудники', 'Сотрудники'));
    for (var key in STAFF) {
      var p = STAFF[key], redT = [], otherT = [], redD = [], otherD = [];
      split(TASKS, key, redT, otherT);
      split(DOCS, key, redD, otherD);
      /* Просрочки считаются из данных: красные задачи плюс красные документы */
      var n = redT.length + redD.length;
      list.appendChild(row(key, p.name, p.role, n > 0 ? 'red' : 'muted', n + ' ' + plural(n, 'просрочка', 'просрочки', 'просрочек')));

      /* Срез: просрочено (задачи, затем документы), остальные задачи, остальные документы */
      var box = card(view(key, 3, p.name, person(key)));
      if (n) {
        box.appendChild(el('h3', null, 'Просрочено'));
        for (var i = 0; i < redT.length; i++) box.appendChild(taskRow(redT[i]));
        for (var j = 0; j < redD.length; j++) box.appendChild(docRow(redD[j]));
      }
      group(box, 'Остальные задачи', otherT, taskRow);
      group(box, 'Остальные документы', otherD, docRow);
      /* Истории сотрудника в данных нет: только финал и Telegram */
      tail(box);
    }
  }

  /* ===== Линия «план и факт»: встроенный SVG, подписи словами снаружи ===== */
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) {
    var n = document.createElementNS(SVG_NS, tag);
    for (var a in attrs) n.setAttribute(a, attrs[a]);
    return n;
  }
  /* 46800 → «46 800» */
  function num(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function amount(v, unit) { return num(v) + (unit === '%' ? '%' : ' ' + unit); }

  function chart(c) {
    var wrap = el('div', 'demo-chart'), last = c.fact.length - 1;
    wrap.appendChild(el('h3', null, c.title));
    var legend = wrap.appendChild(el('div', 'demo-chart__legend'));
    legend.appendChild(el('span', 'demo-chart__key demo-chart__key--fact', 'факт ' + amount(c.fact[last], c.unit)));
    legend.appendChild(el('span', 'demo-chart__key demo-chart__key--plan', 'план ' + amount(c.plan[last], c.unit)));

    /* Масштаб по всем точкам плана и факта, поля по 10% сверху и снизу */
    var W = 300, H = 120, PAD = 6;
    var all = c.plan.concat(c.fact), lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    var span = hi - lo || 1;
    lo -= span * .1; hi += span * .1;
    function x(i) { return PAD + i * (W - 2 * PAD) / last; }
    function y(v) { return PAD + (hi - v) * (H - 2 * PAD) / (hi - lo); }
    function points(list) {
      var p = [];
      for (var i = 0; i < list.length; i++) p.push(x(i).toFixed(1) + ',' + y(list[i]).toFixed(1));
      return p.join(' ');
    }

    function range(list) {
      return list[0] === list[last] ? amount(list[0], c.unit) + ' всё время' : 'от ' + amount(list[0], c.unit) + ' до ' + amount(list[last], c.unit);
    }
    var s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, 'class': 'demo-chart__svg', role: 'img',
      'aria-label': 'Факт: ' + range(c.fact) + ', план: ' + range(c.plan) });
    for (var g = 0; g < 3; g++) {
      var gy = PAD + g * (H - 2 * PAD) / 2;
      s.appendChild(svg('line', { x1: 0, x2: W, y1: gy, y2: gy, 'class': 'demo-chart__grid' }));
    }
    s.appendChild(svg('polyline', { points: points(c.plan), 'class': 'demo-chart__plan' }));
    s.appendChild(svg('polyline', { points: points(c.fact), 'class': 'demo-chart__fact' }));
    for (var i = 0; i <= last; i++) {
      s.appendChild(svg('circle', { cx: x(i), cy: y(c.fact[i]), r: 3, 'class': 'demo-chart__dot' + (i === last ? ' demo-chart__dot--last' : '') }));
    }
    wrap.appendChild(s);

    var axis = wrap.appendChild(el('div', 'demo-chart__axis'));
    axis.appendChild(el('span', null, c.labels[0]));
    axis.appendChild(el('span', null, c.labels[1]));
    return wrap;
  }

  /* ===== Раздел «Показатели» и записи показателей ===== */
  function renderMetrics() {
    var list = card(view('metrics', 2, 'Показатели', 'Показатели'));
    for (var i = 0; i < METRICS.length; i++) {
      list.appendChild(row(METRICS[i].id, METRICS[i].title, METRICS[i].value, METRICS[i].st, METRICS[i].pill));
      renderMetric(METRICS[i]);
    }
  }

  function renderMetric(m) {
    var box = card(view(m.id, 3, m.label, m.title));
    box.appendChild(fields([['Значение', m.value], ['План', m.plan], ['Статус', m.status]]));
    box.appendChild(chart(m.chart));
    if (m.channels) {
      box.appendChild(el('h3', null, 'Каналы'));
      box.appendChild(fields(m.channels.concat([m.channelTotal]), 'demo-fields--money'));
    }
    if (m.debtors) {
      box.appendChild(el('h3', null, 'Должники'));
      var rows = [];
      for (var i = 0; i < m.debtors.length; i++) rows.push([m.debtors[i][0], m.debtors[i][1], 'просрочка ' + m.debtors[i][2]]);
      rows.push(m.debtTotal);
      box.appendChild(fields(rows, 'demo-fields--money'));
    }
    tail(box, [m.history]);
  }

  renderMetrics();
  renderTasks();
  renderDocs();
  renderDowntime();
  renderStaff();

  /* ===== Навигация демо: путь в памяти и в истории браузера =====
     Каждая запись истории хранит полный путь, экран виден в адресе после #.
     Записи от прошлой загрузки страницы считаются главным экраном. */
  var path = ['home'];
  var LOAD = String(Date.now());
  function url(id) { return id === 'home' ? location.pathname + location.search : '#' + id; }
  function state() { return { load: LOAD, path: path.slice() }; }
  var views = scroll.querySelectorAll('.demo-view');
  var step = document.getElementById('demo-step');
  var nav = document.getElementById('demo-nav');

  function show() {
    var id = path[path.length - 1], cur = views[0];
    for (var i = 0; i < views.length; i++) {
      var on = views[i].getAttribute('data-screen') === id;
      views[i].hidden = !on;
      if (on) cur = views[i];
    }
    step.querySelector('span').textContent = cur.getAttribute('data-step');
    step.querySelector('b').textContent = cur.getAttribute('data-label');
    nav.classList.toggle('demo-nav--off', id === 'home');
    /* Финал текущего экрана: с плитки сразу в запись — 1 нажатие, через раздел — 2 */
    var final = cur.querySelector('.demo-final');
    if (final) {
      var n = path.length - 1;
      final.querySelector('[data-count]').textContent = n;
      final.querySelector('[data-word]').textContent = plural(n, 'нажатие', 'нажатия', 'нажатий');
    }
    scroll.scrollTop = 0;
    cur.querySelector('h2').focus({ preventScroll: true });
  }

  /* Перезагрузка с #запись начинается с главного экрана, # пропадает */
  history.replaceState(state(), '', url('home'));

  window.addEventListener('popstate', function (e) {
    if (e.state && e.state.load === LOAD) path = e.state.path.slice();
    else { path = ['home']; history.replaceState(state(), '', url('home')); }
    show();
  });

  document.addEventListener('click', function (e) {
    /* Ссылки на # («Написать в Telegram») иначе создают запись в истории и сбрасывают демо */
    if (e.target.closest('a[href="#"]')) { e.preventDefault(); return; }
    var t = e.target.closest('[data-go], [data-back], [data-root]');
    if (!t) return;
    if (t.hasAttribute('data-go')) {
      path.push(t.getAttribute('data-go'));
      history.pushState(state(), '', url(t.getAttribute('data-go')));
      show();
    }
    /* «Назад» и «Главная» идут по истории браузера, экран меняет popstate */
    else if (t.hasAttribute('data-back')) { if (path.length > 1) history.back(); }
    else if (path.length > 1) history.go(1 - path.length);
    else show();
  });
})();
</script>
</body>
</html>
