<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульт директора</title>
<style>
:root {
  color-scheme: light;
  --accent: #1d4ed8;
  --accent-dark: #1e40af;
  --text: #1a2230;
  --muted: #4b5563;
  --bg: #ffffff;
  --bg-soft: #f3f6fb;
  --line: #d9e0ec;
  --radius: 10px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 18px;
  line-height: 1.55;
  overflow-wrap: break-word;
}
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; }
p { margin: 0 0 1em; }
a { color: var(--accent); }
.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding-left: 16px;
  padding-right: 16px;
}
section, header, footer { padding-top: 40px; padding-bottom: 40px; }
.btn {
  display: inline-block;
  min-height: 48px;
  padding: 12px 24px;
  background: var(--accent);
  color: #ffffff;
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: 600;
  text-align: center;
  text-decoration: none;
}
.btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn-ghost {
  background: transparent;
  color: var(--accent);
}
.btn-ghost:hover { background: var(--bg-soft); color: var(--accent-dark); }
.card {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}
.tag {
  display: inline-block;
  padding: 2px 10px;
  background: #ffffff;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: .8rem;
  font-weight: 600;
  line-height: 1.5;
}
footer { color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line); }
@media (min-width: 720px) {
  h1 { font-size: 2.75rem; }
  h2 { font-size: 1.9rem; }
  section, header, footer { padding-top: 64px; padding-bottom: 64px; }
}
</style>
</head>
<body>
<main>
  <header id="hero"><div class="wrap"></div></header>
  <section id="problem"><div class="wrap"></div></section>
  <section id="modules"><div class="wrap"></div></section>
  <section id="security"><div class="wrap"></div></section>
  <section id="contact"><div class="wrap"></div></section>
</main>
<footer><div class="wrap"></div></footer>
</body>
</html>
